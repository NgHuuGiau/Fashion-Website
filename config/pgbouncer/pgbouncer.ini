; PgBouncer Configuration for HUUGIAU Fashion Website
; Reference: https://www.pgbouncer.org/config.html

[databases]
; PostgreSQL connection (CI/production)
huugiau_fashion = host=db port=5432 dbname=huugiau_fashion user=huugiau

; MSSQL connection (development) - use ODBC driver
; fashion_mssql = host=mssql port=1433 dbname=HUUGIAU_Fashion user=sa password=your_password

[pgbouncer]
; Listen on all interfaces
listen_addr = 0.0.0.0
listen_port = 6432

; Unix socket (for local connections)
unix_socket_dir = /tmp
unix_socket_mode = 0777
unix_socket_group =

; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
auth_hba_file = /etc/pgbouncer/hba_file
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1
auth_user = huugiau

; Pool settings
pool_mode = transaction
max_client_conn = 100
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5

; Connection limits
max_db_connections = 50
max_user_connections = 50

; Timeouts
server_connect_timeout = 10
server_login_retry = 15
query_timeout = 0
query_wait_timeout = 120
client_idle_timeout = 0
idle_transaction_timeout = 300

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
stats_period = 60
verbose = 0

; Admin console
; Admin console is disabled unless explicitly configured in a secret-managed file.

; DNS settings
dns_max_ttl = 15
dns_nxdomain_ttl = 15
dns_zone_check_period = 0

; TLS (optional - enable for production)
; client_tls_sslmode = require
; client_tls_key_file = /etc/pgbouncer/client.key
; client_tls_cert_file = /etc/pgbouncer/client.crt
; client_tls_ca_file = /etc/pgbouncer/ca.crt
; server_tls_sslmode = prefer
; server_tls_key_file = /etc/pgbouncer/server.key
; server_tls_cert_file = /etc/pgbouncer/server.crt

; Dangerous settings (use with caution)
ignore_startup_parameters = extra_float_digits, application_name

[users]
; Users are defined in userlist.txt
