# Dependabot Configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
      - "backend"
    commit-message:
      prefix: "deps(backend)"
      prefix-development: "deps(backend)[dev]"
      include: "scope"
    groups:
      django:
        patterns:
          - "django*"
          - "djangorestframework"
        update-types: ["minor", "patch"]
      security-tools:
        patterns:
          - "bandit"
          - "pip-audit"
          - "safety"
        update-types: ["minor", "patch"]
      linting:
        patterns:
          - "ruff"
          - "mypy"
          - "black"
          - "isort"
          - "pre-commit"
        update-types: ["minor", "patch"]
      testing:
        patterns:
          - "pytest*"
          - "factory-boy"
          - "faker"
        update-types: ["minor", "patch"]
    # Security updates get priority
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      - dependency-name: "django"
        versions: [">=5.0"]  # Wait for Django 5 LTS

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions)"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Frontend dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
      - "frontend"
    commit-message:
      prefix: "deps(frontend)"
      include: "scope"
    groups:
      linting:
        patterns:
          - "eslint*"
          - "stylelint*"
          - "prettier*"
        update-types: ["minor", "patch"]
      build:
        patterns:
          - "vite*"
          - "webpack*"
          - "rollup*"
        update-types: ["minor", "patch"]