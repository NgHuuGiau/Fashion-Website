name: Deploy Production

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://${{ secrets.DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd /opt/fashion-website

            # Pull latest code
            git fetch origin
            git reset --hard origin/main

            # Copy env file (only if missing; never overwrite production secrets)
            if [ ! -f .env.production ]; then
              cp .env.production.example .env.production
            fi
            # Secrets will be injected via GitHub Actions secrets below

            # Deploy with docker-compose
            docker compose -f docker-compose.yml -f docker-compose.production.yml pull
            docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --remove-orphans

            # Wait for health
            sleep 15
            if ! curl -sf https://${{ secrets.DOMAIN }}/health/ >/dev/null; then
              echo "Health check failed!"
              docker compose -f docker-compose.yml -f docker-compose.production.yml logs --tail=50
              exit 1
            fi

            # Cleanup old images
            docker image prune -f
          EOF
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          PGBOUNCER_ADMIN_PASSWORD: ${{ secrets.PGBOUNCER_ADMIN_PASSWORD }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          VNPAY_HASH_SECRET: ${{ secrets.VNPAY_HASH_SECRET }}
          VNPAY_TMN_CODE: ${{ secrets.VNPAY_TMN_CODE }}
          VNPAY_URL: ${{ secrets.VNPAY_URL }}
          SHOP_BANK_ACCOUNT: ${{ secrets.SHOP_BANK_ACCOUNT }}
          SHOP_ACCOUNT_NAME: ${{ secrets.SHOP_ACCOUNT_NAME }}
          SHOP_BANK_CODE: ${{ secrets.SHOP_BANK_CODE }}
          BANK_TRANSFER_ENABLED: ${{ secrets.BANK_TRANSFER_ENABLED }}
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          ZALO_OA_ID: ${{ secrets.ZALO_OA_ID }}
          SOCIAL_FACEBOOK: ${{ secrets.SOCIAL_FACEBOOK }}
          SOCIAL_INSTAGRAM: ${{ secrets.SOCIAL_INSTAGRAM }}
          SOCIAL_TIKTOK: ${{ secrets.SOCIAL_TIKTOK }}
          SOCIAL_YOUTUBE: ${{ secrets.SOCIAL_YOUTUBE }}
          HOTLINE: ${{ secrets.HOTLINE }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
          STORE_ADDRESS: ${{ secrets.STORE_ADDRESS }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}
          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_API_KEY }}

      - name: Notify on failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d '{"text": "❌ Deploy failed for ${{ github.repository }}"}'