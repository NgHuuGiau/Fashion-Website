name: CI Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'docs/**'
  schedule:
    - cron: "0 3 * * 1"  # Weekly Monday 3AM

permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  PYTHON_VERSION: '3.12'
  DJANGO_SETTINGS_MODULE: 'core.settings'
  DEBUG: 'True'
  SECRET_KEY: 'ci-insecure-key-for-tests-only'
  ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
  EMAIL_BACKEND: 'django.core.mail.backends.locmem.EmailBackend'
  EMAIL_HOST: 'localhost'
  DB_ENGINE: 'postgres'
  DB_NAME: 'test_fashion'
  DB_HOST: 'localhost'
  DB_PORT: '5432'
  DB_USER: 'test'
  DB_PASSWORD: 'test'

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Ruff
        run: pip install "ruff>=0.6"

      - name: Run Ruff check
        run: |
          cd backend && ruff check . --output-format=github
        continue-on-error: false

      - name: Run Ruff format check
        run: |
          cd backend && ruff format --check .
        continue-on-error: false

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run mypy
        run: |
          cd backend && mypy . --config-file=pyproject.toml --ignore-missing-imports || true
        continue-on-error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install security tools
        run: |
          pip install bandit==1.7.8 pip-audit==2.7.0

      - name: Run Bandit (SAST)
        run: |
          bandit -r backend -f json -o bandit-results.json
          bandit -r backend -lll

      - name: Run pip-audit (deps vulnerabilities)
        run: |
          pip-audit -r backend/requirements.txt -f json -o pip-audit-results.json

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results
          path: |
            bandit-results.json
            pip-audit-results.json
          retention-days: 14

  test:
    name: Django Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        django-version: ['5.2']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_fashion
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          pip install "Django==${{ matrix.django-version }}.*"

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U test -d test_fashion && break
            sleep 1
          done
          pg_isready -h localhost -p 5432 -U test -d test_fashion || { echo "::error::PostgreSQL not ready"; exit 1; }

      - name: Run Django check
        run: |
          cd backend
          python manage.py check --traceback 2>&1

      - name: Run migrations
        run: |
          cd backend
          set +e
          python manage.py migrate --noinput --traceback --verbosity 2 2>&1 | tee /tmp/migrout.txt
          RC=${PIPESTATUS[0]}
          set -e
          LAST_ERR=$(tail -5 /tmp/migrout.txt | grep -E '^\S' | tail -1 | head -c 500)
          echo "::error file=backend/manage.py::Migration failed (Python ${{ matrix.python-version }}, exit $RC) — $LAST_ERR"
          {
            echo '## Migration Output (Python ${{ matrix.python-version }})'
            echo '```'
            cat /tmp/migrout.txt
            echo '```'
            echo "Exit code: $RC"
          } >> $GITHUB_STEP_SUMMARY
          exit $RC

      - name: Upload migration output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-output-py${{ matrix.python-version }}
          path: /tmp/migrout.txt
          retention-days: 7

      - name: Run tests with coverage
        run: |
          cd backend
          python -m pytest \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -n auto \
            -v \
            --tb=short \
            --junitxml=test-results-${{ matrix.python-version }}-${{ matrix.django-version }}.xml \
            --ignore=tests/stress \
            --ignore=tests/performance

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.django-version }}
          path: |
            backend/coverage.xml
            backend/test-results-*.xml
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ matrix.python-version == '3.12' && matrix.django-version == '5.2' }}
        with:
          files: ./backend/coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}-${{ matrix.django-version }}

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: |
          cd frontend && npm install --no-audit --no-fund

      - name: Run Stylelint (CSS)
        # Tạm thời không gate: CSS legacy còn ~200 lỗi cosmetic
        # (đã dọn 1684 -> ~200). Bật lại khi dọn xong.
        run: |
          cd frontend && npx stylelint "**/*.css" --formatter=github || true

      - name: Run ESLint (JS)
        run: |
          cd frontend && npx eslint "**/*.js" --format=github

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, type-check, security, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Install deps
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Django system check
        run: |
          cd backend && python manage.py check --deploy --fail-level=ERROR

      - name: Collect static (dry-run)
        run: |
          cd backend && python manage.py collectstatic --dry-run --noinput --clear

      - name: Compress CSS/JS (offline manifest, production path)
        run: |
          cd backend && DEBUG=False SECURE_SSL_REDIRECT=False ALLOWED_HOSTS=testserver python manage.py compress --force

      - name: Frontend build check
        run: |
          cd frontend && npm run build || echo "No build script - skipping"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, type-check, security, test, frontend-lint, build]
    steps:
      - name: Collect results
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Lint | ${{ needs.frontend-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**All checks must pass for merge.**" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::One or more CI jobs failed"
          exit 1
