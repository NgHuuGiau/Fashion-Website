# Auto-assign PR reviewers
# https://github.com/posva/auto-assign-action

name: Auto-assign PR

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Auto-assign
        uses: posva/auto-assign-action@v2
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          assignees: "huugiau-backend,huugiau-frontend,huugiau-devops"
          num-of-assignees: 2
          skip-keywords: "wip,draft,do not merge,do-not-merge"
          allow-self-assignment: false
          add-reviewers: true
          reviewer-keywords: "wip,draft,do not merge,do-not-merge"