name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DB_HOST: 127.0.0.1
  DB_PORT: "1433"
  DB_NAME: HUUGIAU_Fashion
  DB_USER: sa
  DB_PASSWORD: "Your_Str0ng!Pass"
  DB_TRUSTED_CONNECTION: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Express
          MSSQL_SA_PASSWORD: "Your_Str0ng!Pass"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P 'Your_Str0ng!Pass' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: python --version

      - name: Create .env file for CI
        run: |
          cp .env.example .env
          sed -i 's/^DB_HOST=.*/DB_HOST='$DB_HOST'/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=1433/' .env
          printf '\nDB_USER=%s\nDB_PASSWORD=%s\nDB_TRUSTED_CONNECTION=false\nDB_DRIVER=%s\n' \
            "$DB_USER" "$DB_PASSWORD" "ODBC Driver 18 for SQL Server" >> .env

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Install ODBC Driver 18 for SQL Server
        run: |
          set -euo pipefail
          cat /etc/os-release | grep -E '^(NAME|VERSION|VERSION_ID)='
          curl_retry() {
            local url="$1" out="$2"
            for i in 1 2 3 4 5; do
              if curl -fSL --retry 3 --retry-delay 2 "$url" -o "$out" 2>/tmp/curl.err; then
                return 0
              fi
              sleep 3
            done
            cat /tmp/curl.err >&2
            return 1
          }
          curl_retry https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb /tmp/microsoft-prod.deb
          sudo dpkg -i /tmp/microsoft-prod.deb
          rm -f /tmp/microsoft-prod.deb
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
          odbcinst -q -d | grep -i 'ODBC Driver 18'

      - name: Run Django checks
        run: python manage.py check
        working-directory: backend

      - name: Run Django deploy checks
        run: python manage.py check --deploy
        working-directory: backend

      - name: Lint with ruff
        run: |
          pip install ruff
          python -m ruff check .
        working-directory: backend

      - name: Create SQL Server database
        run: |
          python - <<'PY'
          import pyodbc
          conn = pyodbc.connect(
              "DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;UID=sa;PWD=Your_Str0ng!Pass;Encrypt=yes;TrustServerCertificate=yes",
              autocommit=True,
          )
          conn.cursor().execute(
              "IF NOT EXISTS (SELECT 1 FROM sys.databases WHERE name = N'HUUGIAU_Fashion')"
              " CREATE DATABASE [HUUGIAU_Fashion]"
          )
          conn.close()
          print("Database HUUGIAU_Fashion ready")
          PY

      - name: Run migrations & seed data
        run: |
          python manage.py migrate
          python manage.py seed_products --sync
        working-directory: backend

      - name: Install test tools
        run: pip install coverage bandit

      - name: Run tests with coverage
        run: |
          # Omit boilerplate (admin/apps/management/templatetags/urls/wsgi) from
          # the coverage gate; focus on application logic. Gate stays at 90%.
          coverage run --source='.' --omit='*/migrations/*,*/tests.py,manage.py,*/admin.py,*/apps.py,*/management/*,*/templatetags/*,*/urls.py,*/wsgi.py,*/asgi.py,*__init__.py' manage.py test orders products users --verbosity=2
          coverage report --show-missing --fail-under=90
        working-directory: backend

      - name: Security scan with bandit
        run: |
          # Only MEDIUM+ findings block CI; Low findings are informational.
          bandit -r backend --ini .bandit --severity-level medium --quiet