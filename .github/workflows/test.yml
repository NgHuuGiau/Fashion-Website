name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: python --version

      - name: Create .env file for CI
        run: |
          echo 'SECRET_KEY=django-insecure-ci-test-key-f00b4r' >> .env
          echo 'SESSION_COOKIE_SECURE=False' >> .env
          echo 'CSRF_COOKIE_SECURE=False' >> .env

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run Django checks
        run: python manage.py check
        working-directory: backend

      - name: Run migrations & seed data
        run: |
          python manage.py migrate
          python manage.py seed_products --sync
        working-directory: backend

      - name: Run tests
        run: python manage.py test orders products users --verbosity=2
        working-directory: backend
