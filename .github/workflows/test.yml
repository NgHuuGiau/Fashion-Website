name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: python --version

      - name: Create .env file for CI
        run: |
          cp .env.example .env
          # GitHub Actions runners have no SQL Server. Fall back to SQLite so
          # migrate/seed/tests can actually run (local dev keeps mssql).
          sed -i 's/^DB_ENGINE=mssql/DB_ENGINE=sqlite3/' .env

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run Django checks
        run: python manage.py check
        working-directory: backend

      - name: Run Django deploy checks
        run: python manage.py check --deploy
        working-directory: backend

      - name: Lint with ruff
        run: |
          pip install ruff
          python -m ruff check .
        working-directory: backend

      - name: Run migrations & seed data
        run: |
          python manage.py migrate
          python manage.py seed_products --sync
        working-directory: backend

      - name: Install test tools
        run: pip install coverage bandit

      - name: Run tests with coverage
        run: |
          # Omit boilerplate (admin/apps/management/templatetags/urls/wsgi) from
          # the coverage gate; focus on application logic. Gate stays at 90%.
          coverage run --source='.' --omit='*/migrations/*,*/tests.py,manage.py,*/admin.py,*/apps.py,*/management/*,*/templatetags/*,*/urls.py,*/wsgi.py,*/asgi.py,*__init__.py' manage.py test orders products users --verbosity=2
          coverage report --show-missing --fail-under=90
        working-directory: backend

      - name: Security scan with bandit
        run: |
          # Only MEDIUM+ findings block CI; Low findings are informational.
          bandit -r backend --ini .bandit --severity-level medium --quiet

      - name: Run Django deploy checks
        run: python manage.py check --deploy
        working-directory: backend