# Dependency Review Configuration
# See: https://github.com/actions/dependency-review-action

# Fail on high/critical vulnerabilities
fail-on-severity: high

# Allow these licenses
allow-licenses:
  - MIT
  - BSD-2-Clause
  - BSD-3-Clause
  - Apache-2.0
  - ISC
  - Python-2.0
  - PSF-2.0
  - Unicode-DFS-2015
  - Unicode-DFS-2016
  - OFL-1.1
  - CC0-1.0
  - CC-BY-4.0
  - CC-BY-SA-4.0

# Deny these licenses (copyleft, etc.)
deny-licenses:
  - GPL-2.0
  - GPL-3.0
  - AGPL-3.0
  - LGPL-2.1
  - LGPL-3.0
  - EPL-1.0
  - MPL-2.0

# Scope to check
scope:
  - runtime
  - development

# Ignore these packages (false positives, internal, etc.)
ignore-packages:
  - name: "django"
    reason: "Core framework - false positive vulnerability reports"
  - name: "psycopg2-binary"
    reason: "Binary package - no source audit needed"

# Severity levels to fail on
severity-threshold: high

# Fail if any vulnerability found at or above threshold
fail-on-severity: high

# Comment on PR with results
comment-summary-in-pr: always

# Show all vulnerabilities or only new ones
only-new-vulnerabilities: false