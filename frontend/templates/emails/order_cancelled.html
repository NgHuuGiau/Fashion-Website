<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đơn hàng đã hủy</title>
</head>
<body style="margin:0;padding:0;background:#f5f0ea;font-family:Arial,Helvetica,sans-serif;color:#2b2118;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f0ea;padding:24px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="background:#b71c1c;padding:24px 32px;">
              <h1 style="margin:0;color:#ffffff;font-size:20px;">HUUGIAU Studio</h1>
              <p style="margin:4px 0 0;color:#ffcdd2;font-size:13px;">Đơn hàng đã hủy</p>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h2 style="margin:0 0 16px;font-size:18px;">Đơn hàng #{{ order.id }} đã bị hủy</h2>
              <p style="margin:0 0 16px;font-size:14px;line-height:1.6;">
                Kính chào <strong>{{ order.customer_name }}</strong>,<br>
                Đơn hàng #{{ order.id }} của bạn đã được hủy. Nếu bạn đã thanh toán, chúng tôi sẽ hoàn tiền sớm nhất có thể.
              </p>
              <p style="margin:24px 0 0;font-size:13px;color:#8a7564;">
                Nếu có thắc mắc, hãy liên hệ qua trang hỗ trợ của chúng tôi.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
