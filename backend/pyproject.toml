[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-website"
version = "1.0.0"
description = "HUUGIAU Fashion Website - Django E-commerce"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=4.2,<5.1",
    "djangorestframework>=3.14",
    "psycopg2-binary>=2.9",
    "django-environ>=0.11",
    "django-cors-headers>=4.3",
    "django-allauth>=0.57",
    "django-crispy-forms>=2.1",
    "crispy-bootstrap5>=2024.2",
    "Pillow>=10.0",
    "django-imagekit>=5.0",
    "django-compressor>=4.2",
    "django-debug-toolbar>=4.2",
    "django-extensions>=3.2",
    "celery>=5.3",
    "redis>=5.0",
    "gunicorn>=21.0",
    "whitenoise>=6.6",
    "django-countries>=7.5",
    "phonenumbers>=8.13",
    "django-phonenumber-field>=7.2",
    "qrcode>=7.4",
    "reportlab>=4.0",
    "weasyprint>=60.0",
    "django-simple-captcha>=0.5.15",
    "django-ratelimit>=4.1",
    "django-axes>=5.5",
    "django-user-agents>=0.4",
    "django-countries-field>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-django>=4.5",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.3",
    "pytest-mock>=3.12",
    "factory-boy>=3.3",
    "faker>=24.0",
    "ruff>=0.5",
    "mypy>=1.11",
    "django-stubs>=4.2",
    "types-requests>=2.31",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "safety>=3.2",
    "pre-commit>=3.6",
    "black>=24.0",
    "isort>=5.13",
    "coverage>=7.3",
    "codecov>=2.1",
]
test = [
    "pytest>=7.4",
    "pytest-django>=4.5",
    "pytest-cov>=4.1",
    "factory-boy>=3.3",
    "faker>=24.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PD",  # pandas-vet (if used)
    "TRY", # tryceratops
    "NPY", # numpy (if used)
    "LOG", # logging-format
    "ASYNC", # async
    "PL",  # pylint
    "TRY", # tryceratops
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default arg (common in Django)
    "S101",  # assert (ok in tests)
    "TRY003", # avoid bare except (sometimes needed)
    "B007",  # loop variable can be constant (Django patterns)
]
per-file-ignores = {}
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "env",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "dist",
    "build",
    "*.egg-info",
    "node_modules",
    "frontend/node_modules",
    "frontend/.next",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
indent-width = 4
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["orders", "products", "users", "core"]
known-third-party = ["django", "rest_framework", "celery", "redis"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
combine-as-imports = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "django.*",
    "rest_framework.*",
    "celery.*",
    "django_*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config --ds=core.settings"
testpaths = ["."]
python_files = ["test_*.py", "*_test.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:django.*",
    "ignore::PendingDeprecationWarning:django.*",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*",
    "*_test.py",
    "manage.py",
    "*/__pycache__/*",
    "*.pyc",
]
branch = true
parallel = true
concurrency = ["multiprocessing"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
skip_covered = true
show_missing = true
precision = 2

[tool.coverage.xml]
output = "coverage.xml"

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100

[tool.bandit]
exclude_dirs = ["tests", "migrations", "venv", ".venv"]
skips = ["B101", "B601"]  # assert, shell=True (sometimes needed)

[tool.pip-audit]
descend = true
skip = ["django"]  # sometimes false positives

[tool.safety]
ignore = ["70612", "70613"]  # known false positives for Django