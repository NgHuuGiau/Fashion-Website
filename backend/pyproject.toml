
# Cau hinh ruff song song o backend/ruff.toml (ruff chi doc ruff.toml khi co).
# [tool.ruff]/[tool.ruff.format]/[tool.ruff.lint.isort] da xoa vi khong co hieu luc.

[tool.mypy]
python_version = "3.12"
# plugins = ["django-stubs.mypy_plugin"]  # Disabled due to plugin issues
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
disable_error_code = ["var-annotated", "attr-defined"]
exclude = [
    "tests\\.py$",
    "test_.*\\.py$",
    ".*_test\\.py$",
]

[[tool.mypy.overrides]]
module = [
    "django.*",
    "celery.*",
    "mssql.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "orders.forms",
    "orders.admin_forms",
    "users.forms",
    "products.management.commands.optimize_images",
    "manage",
]
disable_error_code = ["union-attr", "attr-defined", "assignment", "call-overload", "index", "var-annotated"]

[tool.django-stubs]
django_settings_module = "core.settings"
strict_settings = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config --ds=core.settings"
testpaths = ["."]
python_files = ["test_*.py", "*_test.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:django.*",
    "ignore::PendingDeprecationWarning:django.*",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*",
    "*_test.py",
    "manage.py",
    "*/__pycache__/*",
    "*.pyc",
]
branch = true
parallel = true
concurrency = ["multiprocessing"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
skip_covered = true
show_missing = true
precision = 2

[tool.coverage.xml]
output = "coverage.xml"

[tool.bandit]
exclude_dirs = ["tests", "migrations", "venv", ".venv"]
exclude_paths = []
skips = ["B101", "B601"]  # assert, shell=True (sometimes needed)

[tool.pip-audit]
descend = true
