<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f5f5f5;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 600px; margin: 0 auto; background-color: #ffffff;">
        <!-- Header -->
        <tr>
            <td style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); padding: 30px; text-align: center;">
                <h1 style="margin: 0; color: #ffffff; font-size: 26px; font-weight: 600;">HUUGIAU Fashion</h1>
            </td>
        </tr>

        <!-- Content -->
        <tr>
            <td style="padding: 40px 30px;">
                <h2 style="margin: 0 0 20px; color: #2c3e50; font-size: 22px;">{{ subject }}</h2>

                <div style="color: #34495e; font-size: 16px; line-height: 1.8; white-space: pre-line;">
                    {{ body }}
                </div>

                <div style="margin-top: 30px; text-align: center;">
                    <a href="{{ site_url }}/collections/all" style="display: inline-block; background: #2c3e50; color: #ffffff; padding: 14px 28px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 16px;">Xem sản phẩm</a>
                </div>
            </td>
        </tr>

        <!-- Footer -->
        <tr>
            <td style="background: #f8f9fa; padding: 25px 30px; text-align: center; border-top: 1px solid #ecf0f1;">
                <p style="margin: 0 0 10px; color: #7f8c8d; font-size: 13px;">HUUGIAU Fashion</p>
                <p style="margin: 0; color: #95a5a6; font-size: 12px;">
                    Bạn nhận được email này vì đã đăng ký nhận tin từ HUUGIAU Fashion.<br>
                    <a href="{{ unsubscribe_url }}" style="color: #e74c3c; font-size: 12px;">Hủy đăng ký nhận tin</a>
                </p>
            </td>
        </tr>
    </table>
</body>
</html>
