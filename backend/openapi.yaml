components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        price:
          type: integer
        image_url:
          type: string
        category:
          type: string
        rating_avg:
          type: number
          format: float
        review_count:
          type: integer
    Order:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
        total_amount:
          type: integer
        created_at:
          type: string
          format: date-time
tags:
- name: Products
  description: Product catalog and details
- name: Orders
  description: Order management and checkout
- name: Users
  description: Authentication and user profile
- name: Admin
  description: Admin-only endpoints
