server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Static đã collectstatic (STATIC_ROOT) + CSS/JS nén (CACHE/)
    location /static/ {
        alias /share/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Ảnh sản phẩm (MEDIA_ROOT = frontend/static/images)
    location /media/ {
        alias /share/media/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# HTTPS: đặt cert vào volumes và bỏ comment khối sau (hoặc đặt Caddy/Cloudflare phía trước,
