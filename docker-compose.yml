x-app-environment: &app-environment
  DB_ENGINE: postgres
  DB_HOST: pgbouncer
  DB_PORT: "6432"
  DB_NAME: ${DB_NAME:-huugiau_fashion}
  DB_USER: ${DB_USER:-huugiau}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
  PGBOUNCER_HOST: pgbouncer
  PGBOUNCER_PORT: "6432"
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  TRUSTED_PROXY: ${TRUSTED_PROXY:-True}
  BEHIND_PROXY: ${BEHIND_PROXY:-False}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-huugiau_fashion}
      POSTGRES_USER: ${DB_USER:-huugiau}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-huugiau} -d ${DB_NAME:-huugiau_fashion}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  pgbouncer:
    image: edoburu/pgbouncer:1.22
    restart: unless-stopped
    environment:
      DATABASES_HOST: db
      DATABASES_PORT: 5432
      DATABASES_DBNAME: ${DB_NAME:-huugiau_fashion}
      DATABASES_USER: ${DB_USER:-huugiau}
      DATABASES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 5
      MAX_DB_CONNECTIONS: 50
      MAX_USER_CONNECTIONS: 50
      SERVER_CONNECT_TIMEOUT: 10
      SERVER_LOGIN_RETRY: 15
      QUERY_TIMEOUT: 0
      QUERY_WAIT_TIMEOUT: 120
      CLIENT_IDLE_TIMEOUT: 0
      IDLE_TRANSACTION_TIMEOUT: 300
      LOG_CONNECTIONS: 1
      LOG_DISCONNECTIONS: 1
      LOG_POOLER_ERRORS: 1
      LOG_STATS: 1
      STATS_PERIOD: 60
      PGBOUNCER_ADMIN_PASSWORD: ${PGBOUNCER_ADMIN_PASSWORD:?Set PGBOUNCER_ADMIN_PASSWORD}
    volumes:
      - ./config/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./config/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
      - ./config/pgbouncer/hba_file:/etc/pgbouncer/hba_file:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U huugiau"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      <<: *app-environment
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/frontend/static/images
    expose:
      - "8000"

  celery-worker:
    build: .
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      <<: *app-environment
    command: ["celery", "-A", "core", "worker", "--loglevel=INFO"]
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      <<: *app-environment
    command: ["celery", "-A", "core", "beat", "--loglevel=INFO"]
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8001}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/share/staticfiles:ro
      - media_volume:/share/media:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  static_volume:
  media_volume:
