services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-huugiau_fashion}
      POSTGRES_USER: ${DB_USER:-huugiau}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-huugiau_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-huugiau} -d ${DB_NAME:-huugiau_fashion}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-huugiau_fashion}
      DB_USER: ${DB_USER:-huugiau}
      DB_PASSWORD: ${DB_PASSWORD:-huugiau_pass}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      TRUSTED_PROXY: "True"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/app/backend/staticfiles
      - media_volume:/app/backend/frontend/static/images
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/share/staticfiles:ro
      - media_volume:/share/media:ro
    depends_on:
      - app

volumes:
  pgdata:
  static_volume:
  media_volume: